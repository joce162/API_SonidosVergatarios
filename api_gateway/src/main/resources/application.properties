spring.application.name=api-gateway
server.port=8081

# Destinos de cada microservicio (se pueden cambiar con variables de entorno)
app.login-url=${LOGIN_URL:http://localhost:8082}
app.productos-url=${PRODUCTOS_URL:http://localhost:8083}
app.carrito-url=${CARRITO_URL:http://localhost:8084}

# Orígenes del frontend autorizados por CORS (separados por coma)
app.allowed-origins=${FRONTEND_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# Swagger UI unificado: http://localhost:8081/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.urls[0].name=Login y usuarios
springdoc.swagger-ui.urls[0].url=/openapi/login
springdoc.swagger-ui.urls[1].name=Productos e inventario
springdoc.swagger-ui.urls[1].url=/openapi/productos
springdoc.swagger-ui.urls[2].name=Carrito y compras
springdoc.swagger-ui.urls[2].url=/openapi/carrito
